name: Build GlassClip IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cat > project.yml <<'EOF'
          name: GlassClip
          options:
            bundleIdPrefix: com.paulhubacek
          targets:
            GlassClip:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
                - path: GlassClipApp.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.paulhubacek.glassclip
                  PRODUCT_NAME: GlassClip
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: YES
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF
          xcodegen generate

      - name: Verify project
        run: |
          xcodebuild -project GlassClip.xcodeproj -scheme GlassClip -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|GENERATE_INFOPLIST_FILE|INFOPLIST_FILE"

      - name: Build unsigned app
        run: |
          xcodebuild -project GlassClip.xcodeproj -scheme GlassClip -configuration Release -sdk iphoneos -archivePath build/GlassClip.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/GlassClip.xcarchive/Products/Applications/GlassClip.app build/Payload/
          cd build
          zip -r GlassClip-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassClip-IPA
          path: build/GlassClip-unsigned.ipa
